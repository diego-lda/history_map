name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy without a commit, from the Actions tab.
  workflow_dispatch:

permissions:
  # contents: write so the cap-photos step can push a follow-up commit when an
  # upload from the CMS exceeds 1600px.
  contents: write
  pages: write
  id-token: write

# Never let two deploys race; finish the one in flight, then run the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Decap commits uploads to GitHub untouched, so a photo added from a
      # phone arrives at full resolution. Cap it here — the one point both
      # authoring paths pass through. The script is a no-op when everything is
      # already within the cap, so this cannot loop: the commit it pushes
      # triggers one more run that finds nothing to do.
      - name: Cap photos at 1600px
        run: |
          # The script uses sips on macOS and ImageMagick elsewhere; don't
          # assume the runner image ships it.
          if ! command -v magick >/dev/null && ! command -v convert >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi

          npm run media:optimize

          if [ -n "$(git status --porcelain public/media)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/media
            git commit -m "Resize photos to 1600px"
            git push
          else
            echo "All photos already within the cap."
          fi

      # `npm run build` runs validate + typecheck first, so a bad entry fails
      # here rather than shipping a broken pin.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
