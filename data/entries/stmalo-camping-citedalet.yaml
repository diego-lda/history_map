date: 2025-06-29
type: lodging

description: >
  Este camping en St. Malo está situado justo en una punta del pueblo, muy cerca del Ferry. Desde ahí se puede ver la bahia y como entra y se va el ferry. Tiene muy buenas instalaciones y la verdad es que no es muy pesado, parece que estás en la naturaleza.

opinion: >
  Paramos en este camping antes de coger el ferry para ir de vuelta a Inglaterra cuando nos estabamos mudando a Girona. Estaba muy bien, y fué un lugar perfecto para parar antes de coger el ferry a la mañana siguiente.

place:
