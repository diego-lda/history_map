date: 2023-11-08
type: food

description: >
  A covered market a block south of the zócalo. The middle aisle is the pasillo
  de humo — a corridor of charcoal grills where you buy meat by weight, then eat
  it at communal tables with tortillas, salsa and grilled spring onions.

opinion: >
  Genuinely one of the best meals I've had anywhere, and it cost about six
  dollars. The smoke is not an exaggeration; wear something you're willing to
  wash. Point at what you want rather than trying to order in sentences.

