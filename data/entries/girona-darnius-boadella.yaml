title: Pantà de Darnius-Boadella

coordinates:
  lat: 42.3423382
  lon: 2.8346148


date: 2026-08-15
type: nature

description: >
  Este pantano es muy bonito y tranquilo. También hay un camino que baja al agua, cerca de la caseta de ingenieros, a mano derecha según subes por la carretera a la presa, antes de llegar al parking publico. Bajando al agua, hay un par de mini playas donde se puede pasar el rato, sin nadie alrededor y donde se puede acceder facilmente a nadar.

opinion: >
  Fuimos a ver este pantano, después de ir a Albanya, y nos encantó. No habia nadie y la entrada al agua hace que estés super oculto, con una entrada al agua para nadar. Espectacular.

