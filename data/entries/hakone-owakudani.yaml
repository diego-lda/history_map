id: hakone-owakudani
title: Ōwakudani

coordinates:
  lat: 35.2445
  lon: 139.0203

date: 2025-04-02
type: nature

description: >
  A volcanic valley above Hakone, created by the eruption of Mount Hakone about
  three thousand years ago. Sulphur vents steam continuously across the hillside.
  Reached by ropeway, and the shop at the top sells black eggs boiled in the
  hot springs.

opinion: >
  Worth it for the ropeway ride more than the destination — the valley itself is
  a twenty-minute walk and a gift shop. Go on a clear morning or you'll get
  cloud instead of Fuji. The eggs taste like eggs.

place:
