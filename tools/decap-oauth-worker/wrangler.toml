name = "history-map-cms-auth"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# The site allowed to receive the token. Change if you move to a custom domain.
ALLOWED_ORIGIN = "https://diego-lda.github.io"

# Public by design — GitHub puts the client id in the authorize URL that every
# user sees, so it is configuration, not a credential.
GITHUB_CLIENT_ID = "Ov23licPie2201HjP7G1"

# The client SECRET is the credential. Never put it here; it is set out of band
# and stored encrypted by Cloudflare:
#   npx wrangler secret put GITHUB_CLIENT_SECRET
